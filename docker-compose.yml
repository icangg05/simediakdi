services:
  app:
    build: ./docker/php
    working_dir: /app
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on: [db, redis]
    command: php artisan serve --host=0.0.0.0 --port=8000

  # Worker antrean. Sempat tidak ada sama sekali, dan akibatnya baru terasa saat
  # laboratorium relevansi dibangun: job pemantau pelatihan menumpuk di Redis
  # tanpa pernah dijalankan, jadi progres di layar berhenti di 0% sementara
  # pelatihannya berjalan normal. Dokumen 02 bagian susunan proses memang sudah
  # menyebut tiga worker di produksi, compose pengembangan yang tertinggal.
  #
  # Satu proses untuk antrean `default` saja. Antrean `nlp` sengaja tidak ikut:
  # ia berbagi CPU dengan pelatihan dan inferensi model, dan menambah pesaing di
  # sana hanya memperlambat keduanya.
  worker:
    build: ./docker/php
    working_dir: /app
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    depends_on: [db, redis]
    # Urutan antrean adalah prioritasnya. `default` lebih dulu karena isinya
    # pemantau pelatihan dan prediksi dataset yang menyegarkan layar admin,
    # sedangkan `nlp` boleh menunggu beberapa detik. Tanpa `nlp` di daftar,
    # seluruh analisis relevansi dan sentimen menumpuk tanpa satu pun galat.
    command: php artisan queue:work --queue=default,nlp --tries=1 --timeout=5400

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: simedia
      POSTGRES_USER: simedia
      POSTGRES_PASSWORD: simedia
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simedia"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Satu worker. Model dimuat sekali saat startup dan memakan sekitar 1,5 GB;
  # dua worker berarti dua salinan model di memori yang sama.
  nlp:
    build:
      context: ./nlp
      dockerfile: ../docker/nlp/Dockerfile
    # Uid yang sama dengan `app`, dan itu wajib bukan kosmetik. Artefak model
    # ditulis proses ini lalu dihapus Laravel saat riwayat pelatihan gagal
    # dibuang. Kalau ditulis root, penghapusan dari sisi Laravel gagal tanpa
    # suara: barisnya hilang dari database dan direktori 1,3 GB tertinggal
    # tanpa satu pun catatan yang menunjuknya.
    user: "1000:1000"
    volumes:
      - ./nlp:/nlp
      - modelnlp:/model
      # Dataset hasil ekspor dan artefak model, dipasang di path yang sama
      # persis dengan sisi Laravel. Kontrak pelatihan mengirim lokasi berkas,
      # bukan isinya (dokumen 10 bagian 19.3), dan itu mengandaikan keduanya
      # melihat filesystem yang sama seperti di server produksi. Di compose
      # keduanya container terpisah, jadi kesamaan path harus dibuat sendiri.
      - ./storage/app/private:/app/storage/app/private
    ports:
      # Di produksi ikat ke 127.0.0.1 saja, tidak ada endpoint publik dan tidak
      # ada autentikasi selain binding itu (dokumen 02 bagian 1 dan dokumen 06).
      - "127.0.0.1:8001:8001"
    environment:
      HF_HOME: /model
      # Produksi memakai 2, sesuai spesifikasi server dokumen 02 (4 vCPU, dua
      # di antaranya untuk inferensi). Mesin pengembangan biasanya punya lebih,
      # dan penarikan arsip menghasilkan ribuan artikel yang harus dianalisis.
      TORCH_THREADS: "${TORCH_THREADS:-8}"

  # Tangkapan layar bukti pemuatan. Dipisah dari nlp supaya render Chromium
  # tidak menahan antrean inferensi yang jalan satu worker.
  arsip:
    build:
      context: ./arsip
      dockerfile: ../docker/arsip/Dockerfile
    volumes:
      - ./arsip:/arsip
    ports:
      - "127.0.0.1:8002:8002"

volumes:
  dbdata:
  modelnlp:
