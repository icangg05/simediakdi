# Dua aturan berlaku untuk seluruh layanan yang berumur panjang di berkas ini,
# dan keduanya lahir dari satu kejadian nyata: 805 galat
# "getaddrinfo for redis failed" di log, yang berarti nama `redis` tidak bisa
# diselesaikan sama sekali karena container-nya memang sedang tidak ada.
#
# 1. `restart: unless-stopped`. Tanpa ini, satu container yang mati tetap mati
#    sampai ada yang menyadarinya. Di laptop itu merepotkan. Di server itu
#    berarti crawler, penjadwal, atau antrean berhenti diam-diam berhari-hari,
#    karena tidak ada satu pun halaman yang menampilkan bahwa prosesnya hilang.
#
# 2. `depends_on` dengan `condition`, bukan daftar biasa. Bentuk daftar hanya
#    menunggu container tetangga dibuat, bukan siap menerima koneksi, jadi
#    Laravel tetap bisa menembak Redis dan Postgres yang belum mengangkat
#    soketnya. Itu yang membuat permintaan pertama setelah setiap `up` gagal.
services:
  # Caddy memegang port 8000, bukan Laravel.
  #
  # Ia yang mengompresi seluruh jawaban dan melayani berkas statis, alasannya
  # ditulis lengkap di docker/caddy/Caddyfile. Yang perlu diingat di sini cuma
  # satu: alamat aplikasi tetap http://localhost:8000, yang berpindah adalah
  # siapa yang mengangkat teleponnya.
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro
      - caddydata:/data
      - caddyconfig:/config
    # Terkunci di loopback, bukan 0.0.0.0.
    #
    # Di laptop tidak ada bedanya, http://localhost:8000 tetap terbuka. Di
    # server bedanya besar: bentuk `8000:8000` menerbitkan port itu ke seluruh
    # antarmuka jaringan, dan aturan UFW tidak menutupinya karena Docker
    # menulis rule-nya sendiri di chain DOCKER yang dievaluasi lebih dulu.
    # Di produksi, reverse proxy milik host yang memegang 80 dan 443 lalu
    # meneruskannya ke sini.
    ports:
      - "127.0.0.1:8000:8000"
      # - "8000:8000"
    depends_on:
      - app

  app:
    build: ./docker/php
    working_dir: /app
    user: "1000:1000"
    restart: unless-stopped
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    # Tidak lagi menerbitkan port ke host. Satu-satunya jalan masuk adalah
    # Caddy, supaya tidak ada pintu kedua yang melewatkan kompresi diam-diam.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `artisan serve` adalah server pengembangan berproses tunggal. Di server
    # sungguhan ganti dengan php-fpm atau Octane di belakang Nginx, karena satu
    # proses berarti satu permintaan lambat menahan seluruh pengunjung lain.
    command: php artisan serve --host=0.0.0.0 --port=8000

  # Worker antrean untuk crawler dan arsip bukti pemuatan.
  #
  # Ingat: proses ini memuat kode PHP sekali saat start. Setiap kali kode job
  # berubah ia harus di-restart, kalau tidak ia terus menjalankan versi lama
  # tanpa satu pun galat yang menunjukkannya.
  worker:
    build: ./docker/php
    working_dir: /app
    user: "1000:1000"
    restart: unless-stopped
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Urutan antrean menentukan prioritas worker. `default` dan `crawl` lebih
    # dulu karena keduanya pendek dan pengambilan isi artikel adalah syarat
    # sebelum artikelnya bisa dinilai sama sekali. `gemini` paling belakang
    # karena ia pekerjaan latar yang menunda dirinya sendiri saat kuota habis,
    # dan menaruhnya di depan akan membuat crawler menunggu di belakang ribuan
    # pekerjaan yang sedang tidur.
    #
    # `--tries=1` tetap berlaku untuk antrean lain. Job Gemini menetapkan
    # batasnya sendiri lewat properti `$tries` dan `retryUntil()`, karena
    # penundaan karena kuota ikut terhitung sebagai percobaan dan kuota harian
    # baru pulih tengah malam waktu Pasifik.
    command: php artisan queue:work --queue=default,crawl,gemini --tries=1 --timeout=1800

  # Worker khusus pelatihan model relevansi.
  #
  # Terpisah dari worker utama, dan bukan demi kerapian. Satu pelatihan IndoBERT
  # di CPU berjalan belasan sampai puluhan menit, dan selama itu worker yang
  # mengerjakannya tidak menyentuh antrean lain sama sekali. Kalau pekerjaan ini
  # ikut antrean `default`, seluruh crawler dan penilaian Gemini berhenti
  # sepanjang pelatihan tanpa satu pun galat yang menunjukkan sebabnya.
  #
  # Timeout-nya tujuh hari lewat sedikit, jauh di atas worker utama. Job
  # menunggui layanan Python lewat polling, jadi seluruh durasi pelatihan
  # terhitung sebagai satu pekerjaan yang berjalan.
  #
  # Tujuh hari supaya snapshot 10.000 item muat. Pelatihan 2.000 item selesai
  # dalam 5 jam 45 menit, dan pelatihan di CPU tumbuh kira-kira sebanding
  # dengan jumlah data, jadi 10.000 item berarti sekitar 29 jam. Alasan
  # lengkapnya ada di `$timeout` pada LatihModelRelevansi.
  #
  # Angkanya sengaja lebih besar daripada `$timeout` di LatihModelRelevansi,
  # sepuluh menit di atasnya. Kalau keduanya sama persis, keduanya berbunyi
  # pada detik yang sama dan yang tercatat adalah pembunuhan oleh worker, bukan
  # penanganan job sendiri. Bedanya besar di layar: yang pertama meninggalkan
  # baris berstatus berjalan selamanya, yang kedua menulis "Gagal" beserta
  # keterangan kehabisan waktu lewat `failed()`.
  worker-pelatihan:
    build: ./docker/php
    working_dir: /app
    # Satu-satunya layanan di berkas ini yang memang bunuh diri. Worker antrean
    # Laravel keluar dengan kode 1 begitu satu job melewati batas waktunya,
    # karena proses yang sudah dipaksa berhenti di tengah jalan tidak dianggap
    # aman untuk melanjutkan job berikutnya. Tanpa baris ini, antrean pelatihan
    # ikut mati bersamanya dan pelatihan berikutnya menggantung di status
    # menunggu tanpa satu pun galat, sampai ada yang sadar container-nya sudah
    # tidak ada.
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      relevansi:
        condition: service_started
    # `-d memory_limit=1G`, dan hanya di worker ini.
    #
    # Batas waktu bukan satu-satunya yang menghalangi snapshot besar. Job
    # menyusun seluruh dataset menjadi satu array PHP lalu meng-encode-nya
    # menjadi satu badan JSON, dan keduanya berada di memori pada saat yang
    # sama. Snapshot 2.000 item saja sudah memuncak di 70 MB, sedangkan batas
    # bawaan image PHP adalah 128 MB. Snapshot 10.000 item berarti badan JSON
    # sekitar 32 MB beserta array sumbernya, dan pelatihan akan mati karena
    # kehabisan memori sebelum satu byte pun sampai ke layanan Python.
    #
    # Dinaikkan di sini, bukan di php.ini, supaya hanya proses ini yang boleh
    # menyerap satu giga. Batas 128 MB pada proses web dan worker utama adalah
    # penjaga yang berguna: permintaan yang menyentuhnya hampir selalu sedang
    # memuat tabel utuh tanpa paginasi, dan itu memang harus gagal.
    command: php -d memory_limit=1G artisan queue:work --queue=pelatihan --tries=1 --timeout=605400

  # Penjadwal. Tanpa proses ini seluruh isi routes/console.php tidak pernah
  # berjalan, termasuk pengisi antrean Gemini yang membuat klasifikasi otomatis
  # jalan sendiri. Sebelumnya memang tidak ada, jadi jadwal crawl, alert, dan
  # ringkasan harian pun hanya berjalan kalau dipanggil tangan.
  #
  # `schedule:work` menjaga dirinya sendiri di latar depan dan memeriksa tiap
  # menit, jadi tidak perlu cron di dalam image.
  scheduler:
    build: ./docker/php
    working_dir: /app
    user: "1000:1000"
    restart: unless-stopped
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan schedule:work

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: simedia
      POSTGRES_USER: simedia
      POSTGRES_PASSWORD: simedia
      TZ: UTC
    # Tidak menerbitkan port ke host sama sekali.
    #
    # Seluruh pemakainya ada di dalam jaringan compose dan memanggilnya lewat
    # nama `db`, jadi publikasi ke host tidak dipakai siapa pun. Yang
    # ditinggalkannya di server adalah Postgres yang bisa dicoba paksa dari
    # internet. Butuh DBeaver dari laptop? Pakai terowongan SSH:
    # `ssh -L 5432:localhost:5432 user@server`.
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simedia"]
      interval: 5s
      retries: 10

  # Redis di sini bukan sekadar cache. Ia juga tempat antrean, jadi container
  # yang mati membawa serta seluruh pekerjaan yang belum sempat dikerjakan.
  #
  # `appendonly yes` membuatnya menulis ke disk, dan volumenya membuat tulisan
  # itu bertahan setelah container dibuat ulang. Tanpa keduanya, satu restart
  # menghapus antrean klasifikasi tanpa satu pun galat: artikelnya tetap ada di
  # database dengan status menunggu, dan tidak ada lagi yang akan mengambilnya
  # sampai `gemini:antre --isi` berikutnya menyisir ulang sejam kemudian.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    # Tidak menerbitkan port ke host, alasannya sama dengan `db` dan di sini
    # lebih tajam lagi: Redis berjalan tanpa kata sandi. Selama portnya
    # terbuka ke internet, siapa pun bisa membaca dan menghapus seluruh
    # antrean tanpa perlu menebak apa pun.
    #
    # Inilah yang membuat `condition: service_healthy` di atas ada artinya.
    # Tanpa healthcheck, Compose menganggap Redis siap pada detik container
    # dibuat, jauh sebelum ia mengangkat soketnya.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Tangkapan layar bukti pemuatan. Satu-satunya layanan Python yang tersisa
  # setelah IndoBERT dibongkar, dan tetap terpisah karena render Chromium berat.
  arsip:
    build:
      context: ./arsip
      dockerfile: ../docker/arsip/Dockerfile
    restart: unless-stopped
    volumes:
      - ./arsip:/arsip
    ports:
      - "127.0.0.1:8002:8002"

  # Pelatihan dan inferensi model relevansi IndoBERT.
  #
  # Repositori ikut di-mount ke /app supaya artefak model tersimpan di
  # storage/app/private/model-relevansi, tempat yang sama yang dibaca dan
  # dihapus Laravel lewat Storage. Tanpa itu, penghapusan model dari layar
  # harus lewat panggilan HTTP tersendiri hanya untuk membuang direktori.
  #
  # `modeldata` menyimpan unduhan bobot base model dari Hugging Face. Tanpa
  # volume ini, indobert-base-p1 sebesar 500 MB diunduh ulang setiap kali
  # container dibuat ulang.
  relevansi:
    build:
      context: ./relevansi
      dockerfile: ../docker/relevansi/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOME: /tmp
      ARTEFAK_DIR: /app/storage/app/private/model-relevansi
      # Dibatasi supaya pelatihan tidak memakan seluruh inti mesin dan membuat
      # Postgres serta worker antrean tersendat selama belasan menit.
      #
      # Delapan, bukan empat. Diukur pada checkpoint 24 layer di potongan 256
      # token dengan batch 8: empat thread memberi 32 detik per langkah dan
      # sepuluh thread memberi 21,8 detik. Sisa empat inti cukup untuk seluruh
      # container lain. Menaikkannya lagi tidak banyak menolong, pelatihan CPU
      # tersendat di lebar jalur memori, bukan di jumlah inti.
      RELEVANSI_THREAD: "8"
    volumes:
      - .:/app
      - ./relevansi:/relevansi
      - modeldata:/model
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  dbdata:
  modeldata:
  redisdata:
  caddydata:
  caddyconfig:
