services:
  app:
    build: ./docker/php
    working_dir: /app
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on: [db, redis]
    command: php artisan serve --host=0.0.0.0 --port=8000

  # Worker antrean untuk crawler dan arsip bukti pemuatan.
  #
  # Ingat: proses ini memuat kode PHP sekali saat start. Setiap kali kode job
  # berubah ia harus di-restart, kalau tidak ia terus menjalankan versi lama
  # tanpa satu pun galat yang menunjukkannya.
  worker:
    build: ./docker/php
    working_dir: /app
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    depends_on: [db, redis]
    # Antrean `nlp` dihapus bersama IndoBERT. Yang tersisa `crawl` untuk
    # pengambilan isi artikel dan arsip bukti pemuatan, plus `default`.
    # Klasifikasi Gemini tidak lewat antrean sama sekali: ia dijalankan sinkron
    # dari tombol di halaman Antrean Klasifikasi.
    command: php artisan queue:work --queue=default,crawl --tries=1 --timeout=1800

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: simedia
      POSTGRES_USER: simedia
      POSTGRES_PASSWORD: simedia
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simedia"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Tangkapan layar bukti pemuatan. Satu-satunya layanan Python yang tersisa
  # setelah IndoBERT dibongkar, dan tetap terpisah karena render Chromium berat.
  arsip:
    build:
      context: ./arsip
      dockerfile: ../docker/arsip/Dockerfile
    volumes:
      - ./arsip:/arsip
    ports:
      - "127.0.0.1:8002:8002"

volumes:
  dbdata:
