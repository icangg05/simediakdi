services:
  app:
    build: ./docker/php
    working_dir: /app
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on: [db, redis]
    command: sleep infinity

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: simedia
      POSTGRES_USER: simedia
      POSTGRES_PASSWORD: simedia
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simedia"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  dbdata:
