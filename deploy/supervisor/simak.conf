; Worker queue SIMAK Kendari.
; Salin ke /etc/supervisor/conf.d/simak.conf, lalu:
;   supervisorctl reread && supervisorctl update
;
; Antrian dipisah dua nama agar crawler tidak terhalang pekerjaan lain.
; Setelah deploy, jalankan `php artisan queue:restart` supaya worker memuat
; kode baru, worker adalah proses panjang dan tidak membacanya sendiri.
;
; Antrean `nlp` dihapus bersama IndoBERT. Klasifikasi Gemini tidak lewat
; antrean sama sekali, ia dijalankan sinkron dari halaman Antrean Klasifikasi.

[program:simak-queue-crawl]
command=php /var/www/simak/artisan queue:work redis --queue=crawl --sleep=3 --tries=3 --max-time=3600
directory=/var/www/simak
user=www-data
numprocs=3
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/simak/queue-crawl.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:simak-queue-default]
command=php /var/www/simak/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/simak
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/simak/queue-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; Scheduler. Alternatifnya satu baris di crontab www-data:
;   * * * * * cd /var/www/simak && php artisan schedule:run >> /dev/null 2>&1
[program:simak-scheduler]
command=php /var/www/simak/artisan schedule:work
directory=/var/www/simak
user=www-data
numprocs=1
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/simak/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
